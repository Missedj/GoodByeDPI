services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--save", "900", "1"]
    restart: unless-stopped
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["uvicorn","backend.app.main:app","--host","0.0.0.0","--port","8000"]   # <— добавь эту строку
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./infra/sessions:/app/infra/sessions
      - ./dist:/app/dist:ro

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./infra/sessions:/app/infra/sessions
    deploy:
      replicas: 1

volumes:
  pgdata: {}
  redisdata: {}
